<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motoristas - CineFrota Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100">

    <div id="loading-screen" class="min-h-screen flex items-center justify-center">
        <p class="text-gray-400">Verificando sessão...</p>
    </div>

    <div id="app-layout" class="hidden">
        
        <aside class="w-64 bg-gray-800 shadow-md fixed h-full">
            <div class="p-6">
                <h1 class="text-xl font-bold text-yellow-400">CineFrota Log</h1>
            </div>
            <nav class="mt-6">
                <a href="/dashboard.html" class="block py-3 px-6 text-gray-300 hover:bg-gray-700">
                    Dashboard
                </a>
                <a href="/trabalhos.html" class="block py-3 px-6 text-gray-300 hover:bg-gray-700">
                    Trabalhos
                </a>
                <a href="/veiculos.html" class="block py-3 px-6 text-gray-300 hover:bg-gray-700">
                    Veículos
                </a>
                <a href="/motoristas.html" class="block py-3 px-6 text-gray-300 font-semibold bg-gray-700"> Motoristas
                </a>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col h-screen overflow-y-auto ml-64">
            <header class="bg-gray-800 shadow-sm">
                <div class="flex items-center justify-end h-16 px-6">
                    <button id="logout-button" 
                            class="bg-yellow-400 text-gray-900 font-bold py-2 px-4 rounded-md hover:bg-yellow-500 text-sm">
                        Sair
                    </button>
                </div>
            </header>
            
            <main class="flex-1 p-6">
                <h1 class="text-3xl font-bold text-white mb-6">Gestão de Motoristas</h1>

                <div class="bg-gray-800 p-6 rounded-lg shadow mb-6">
                    <h2 class="text-xl font-semibold mb-4">Cadastrar Novo Motorista</h2>
                    <form id="form-novo-motorista" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label for="nome_completo" class="block text-sm font-medium text-gray-300">Nome Completo</label>
                            <input type="text" id="nome_completo" required class="mt-1 block w-full bg-gray-700 border-gray-600 rounded-md text-white p-2">
                        </div>
                        <div>
                            <label for="telefone" class="block text-sm font-medium text-gray-300">Telefone</label>
                            <input type="text" id="telefone" placeholder="(11) 99999-9999" class="mt-1 block w-full bg-gray-700 border-gray-600 rounded-md text-white p-2">
                        </div>
                         <div>
                            <label for="cnh" class="block text-sm font-medium text-gray-300">CNH</label>
                            <input type="text" id="cnh" class="mt-1 block w-full bg-gray-700 border-gray-600 rounded-md text-white p-2">
                        </div>
                        <div class="md:col-span-3">
                            <button type="submit" 
                                    class="w-full md:w-auto bg-yellow-400 text-gray-900 font-bold py-2 px-6 rounded-md hover:bg-yellow-500 transition-colors">
                                Salvar Motorista
                            </button>
                        </div>
                    </form>
                    <div id="form-message" class="mt-4 text-green-400"></div>
                </div>

                <div class="bg-gray-800 rounded-lg shadow overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-700">
                        <thead class="bg-gray-700">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Nome</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Telefone</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">CNH</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-motoristas-body" class="bg-gray-800 divide-y divide-gray-700">
                            <tr><td colspan="3" class="p-4 text-center text-gray-400">A carregar motoristas...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    
    <script type="module" src="./auth.js"></script>
    <script type="module" src="./motoristas.js"></script>
</body>
</html>
