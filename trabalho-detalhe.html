<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Trabalho - CineFrota Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100">

    <div id="loading-screen" class="min-h-screen flex items-center justify-center">
        <p class="text-gray-400">Verificando sessão...</p>
    </div>

    <div id="app-layout" class="hidden">
        
        <aside class="w-64 bg-gray-800 shadow-md fixed h-full">
            <div class="p-6">
                <h1 class="text-xl font-bold text-yellow-400">CineFrota Log</h1>
            </div>
            <nav class="mt-6">
                <a href="/dashboard.html" class="block py-3 px-6 text-gray-300 hover:bg-gray-700">Dashboard</a>
                <a href="/trabalhos.html" class="block py-3 px-6 text-gray-300 font-semibold bg-gray-700">Trabalhos</a> <a href="/veiculos.html" class="block py-3 px-6 text-gray-300 hover:bg-gray-700">Veículos</a>
                <a href="/motoristas.html" class="block py-3 px-6 text-gray-300 hover:bg-gray-700">Motoristas</a>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col h-screen overflow-y-auto ml-64">
            <header class="bg-gray-800 shadow-sm">
                <div class="flex items-center justify-end h-16 px-6">
                    <button id="logout-button" class="bg-yellow-400 text-gray-900 font-bold py-2 px-4 rounded-md hover:bg-yellow-500 text-sm">Sair</button>
                </div>
            </header>
            
            <main class="flex-1 p-6">
                <div class="mb-6">
                    <a href="/trabalhos.html" class="text-yellow-400 hover:underline">&larr; Voltar para Trabalhos</a>
                    <h1 id="titulo-trabalho" class="text-3xl font-bold text-white mt-2">A carregar...</h1>
                    <p id="cliente-trabalho" class="text-lg text-gray-400"></p>
                </div>

                <div class="bg-gray-800 p-6 rounded-lg shadow mb-6">
                    <h2 class="text-xl font-semibold mb-4">Alocar Veículo para este Trabalho</h2>
                    <form id="form-nova-alocacao" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                        
                        <div>
                            <label for="select-veiculo" class="block text-sm font-medium text-gray-300">Veículo</label>
                            <select id="select-veiculo" required class="mt-1 block w-full bg-gray-700 border-gray-600 rounded-md text-white p-2">
                                <option value="">A carregar...</option>
                            </select>
                        </div>

                        <div>
                            <label for="select-motorista" class="block text-sm font-medium text-gray-300">Motorista</label>
                            <select id="select-motorista" required class="mt-1 block w-full bg-gray-700 border-gray-600 rounded-md text-white p-2">
                                <option value="">A carregar...</option>
                            </select>
                        </div>
                        
                        <div>
                            <label for="valor_diaria" class="block text-sm font-medium text-gray-300">Valor Diária (R$)</label>
                            <input type="number" step="0.01" id="valor_diaria" required placeholder="1500.00" class="mt-1 block w-full bg-gray-700 border-gray-600 rounded-md text-white p-2">
                        </div>

                        <div>
                            <button type="submit" 
                                    class="w-full bg-yellow-400 text-gray-900 font-bold py-2 px-6 rounded-md hover:bg-yellow-500 transition-colors">
                                Salvar Alocação
                            </button>
                        </div>
                    </form>
                    <div id="form-message" class="mt-4 text-green-400"></div>
                </div>

                <h2 class="text-2xl font-semibold text-white mb-4">Veículos Alocados neste Trabalho</h2>
                <div class="bg-gray-800 rounded-lg shadow overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-700">
                        <thead class="bg-gray-700">
                            <tr>
                                <th classclass="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Veículo</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Motorista</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Valor da Diária</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-alocacoes-body" class="bg-gray-800 divide-y divide-gray-700">
                            <tr><td colspan="3" class="p-4 text-center text-gray-400">A carregar alocações...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    
    <script type="module" src="./auth.js"></script>
    <script type="module" src="./trabalho-detalhe.js"></script>
</body>
</html>
