<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFrota Log - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-sm">
        <h1 class="text-2xl font-bold text-center text-yellow-400 mb-6">CineFrota Log</h1>
        
        <form id="login-form">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-300">Email</label>
                <input type="email" id="email" required
                       class="mt-1 block w-full bg-gray-700 border-gray-600 rounded-md shadow-sm text-white p-2">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-300">Senha</label>
                <input type="password" id="password" required
                       class="mt-1 block w-full bg-gray-700 border-gray-600 rounded-md shadow-sm text-white p-2">
            </div>
            <button type="submit" 
                    class="w-full bg-yellow-400 text-gray-900 font-bold py-2 px-4 rounded-md hover:bg-yellow-500 transition-colors">
                Entrar
            </button>
        </form>
        
        <div id="error-message" class="mt-4 text-red-400 text-center"></div>
    </div>

    <script type="module" src="./auth.js"></script>
</body>
</html>
