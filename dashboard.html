<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CineFrota Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100">

    <div id="loading-screen" class="min-h-screen flex items-center justify-center">
        <p class="text-gray-400">Verificando sessão...</p>
    </div>

    <div id="app-layout" class="hidden">
        
        <aside class="w-64 bg-gray-800 shadow-md fixed h-full">
            <div class="p-6">
                <h1 class="text-xl font-bold text-yellow-400">CineFrota Log</h1>
            </div>
            <nav class="mt-6">
                <a href="#" class="block py-3 px-6 text-gray-300 font-semibold bg-gray-700">
                    Dashboard
                </a>
                <a href="#" class="block py-3 px-6 text-gray-300 hover:bg-gray-700">
                    Trabalhos
                </a>
                <a href="#" class="block py-3 px-6 text-gray-300 hover:bg-gray-700">
                    Veículos
                </a>
                <a href="#" class="block py-3 px-6 text-gray-300 hover:bg-gray-700">
                    Motoristas
                </a>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col h-screen overflow-y-auto ml-64">
            <header class="bg-gray-800 shadow-sm">
                <div class="flex items-center justify-end h-16 px-6">
                    <button id="logout-button" 
                            class="bg-yellow-400 text-gray-900 font-bold py-2 px-4 rounded-md hover:bg-yellow-500 text-sm">
                        Sair
                    </button>
                </div>
            </header>
            <main class="flex-1 p-6">
                <h1 class="text-3xl font-bold text-white mb-6">Dashboard</h1>
                <div class="bg-gray-800 p-6 rounded-lg shadow">
                    <p>Bem-vindo ao painel de controle!</p>
                </div>
            </main>
        </div>
    </div>
    
    <script type="module" src="./auth.js"></script>
</body>
</html>
